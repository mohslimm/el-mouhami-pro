[package]
name = "al-mouhami-voice-agent"
version = "0.1.0"
description = "Agent Vocal et Assistant Juridique — Cabinet Slimani"
authors = ["Cabinet Slimani"]
edition = "2021"

[lib]
name = "al_mouhami_voice_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
dotenvy = "0.15"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
